@if (session.tourIndex() === null) {
<div class="dock">
  <div class="drawers">
  @if (hud().tray) {
    <div class="drawer tray" appOccludes id="hud-tray">
      <app-piece-tray [thumbnailer]="thumbnailer()" (picked)="picked.emit($event)" (focused)="focused.emit($event)" />
    </div>
  }
  @if (hud().map) {
    <div class="drawer map" appOccludes id="hud-map">
      <app-bench-map
        (aimSelected)="aimSelected.emit()"
        (picked)="picked.emit($event)"
        (focused)="focused.emit($event)"
        (orbit)="orbit.emit($event)"
      />
    </div>
  }
  </div>
</div>
}
