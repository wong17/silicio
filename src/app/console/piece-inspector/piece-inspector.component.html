<section class="inspector" aria-label="Pieza seleccionada">
  <header>
    <p class="kicker">Pieza seleccionada</p>
    <h3>{{ name() }}</h3>
  </header>
  <p class="description">{{ session.selectedDescription() }}</p>

  <div class="actions">
    <button type="button" [attr.aria-busy]="busy() === 'focus'" [disabled]="busy() !== null" (click)="act('focus')">
      Enfocar
    </button>
    <button type="button" [attr.aria-busy]="busy() === 'aim'" [disabled]="busy() !== null" (click)="act('aim')">
      Iluminar
    </button>
    @if (chipStation() && internal() && !chipOpen()) {
      <button type="button" [attr.aria-busy]="busy() === 'chip'" [disabled]="busy() !== null" (click)="act('chip')">
        Abrir chip
      </button>
    }
  </div>

  @if (chipStation()) {
    <div class="amount">
      <label class="kicker" for="explode-amount">Apertura del chip</label>
      <input
        id="explode-amount"
        type="range"
        min="0"
        max="100"
        step="5"
        [value]="session.exploded() ? session.explodeAmount() : 0"
        (input)="setAmount($any($event.target).value)"
      />
      <output for="explode-amount">{{ session.exploded() ? session.explodeAmount() : 0 }} %</output>
    </div>
  }
</section>
