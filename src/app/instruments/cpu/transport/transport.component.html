<div class="transport" role="group" aria-label="Ejecución del procesador">
  <div class="controls">
    <button
      type="button"
      class="control"
      data-tip="Retroceder"
      aria-label="Retroceder un paso"
      [disabled]="session.cursor() < 0"
      (click)="session.intent('back')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-5-5 5 5 5" /></svg>
    </button>
    <button
      type="button"
      class="control"
      data-tip="Paso"
      aria-label="Ejecutar un paso"
      [disabled]="session.state().halted"
      (click)="session.intent('step')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM19 5v14" /></svg>
    </button>
    <button
      type="button"
      class="control primary"
      [attr.data-tip]="session.running() ? 'Pausar' : 'Ejecutar'"
      [attr.aria-label]="session.running() ? 'Pausar la ejecución' : 'Ejecutar continuamente'"
      [attr.aria-pressed]="session.running()"
      [disabled]="session.state().halted && !session.running()"
      (click)="session.intent('run')"
    >
      @if (session.running()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" /></svg>
      }
    </button>
  </div>
  <div class="status">
    <span
      class="led"
      [class.run]="session.running()"
      [class.halt]="session.state().halted"
      aria-hidden="true"
    ></span>
    <span class="label">
      {{ session.running() ? 'EJECUTANDO' : session.state().halted ? 'HLT' : 'EN PAUSA' }}
    </span>
    <span class="count">
      paso {{ session.cursor() + 1 }} / {{ session.trace().length }}
    </span>
  </div>
</div>

<div class="phases" role="group" aria-label="Fases de la instrucción">
  <ol>
    @for (p of phases; track p.id; let i = $index) {
      <li>
        <button
          type="button"
          [attr.aria-pressed]="session.phase() === p.id"
          [disabled]="session.cursor() < 0"
          (click)="show(p.id)"
        >
          <span class="n" aria-hidden="true">{{ i + 1 }}</span>
          {{ p.label }}
        </button>
      </li>
    }
  </ol>
  <p class="summary" aria-live="polite">{{ summary() }}</p>
</div>
