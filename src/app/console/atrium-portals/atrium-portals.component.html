<nav class="portals" aria-label="Estaciones del laboratorio">
  @for (e of experiences; track e.id) {
    <a class="portal" [routerLink]="'/' + e.id" [style.--accent]="e.accent">
      <span class="number">{{ e.number }}</span>
      <span class="copy">
        <strong>{{ e.title }}</strong>
        <small>{{ e.subtitle }}</small>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
    </a>
  }
</nav>
