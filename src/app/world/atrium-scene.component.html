<canvas
  #canvas
  aria-label="Laboratorio3D. Usa los controles de giro, zoom y selección disponibles en la interfaz."
></canvas>
@if (!supported()) {
  <div class="fallback" role="status">
    <p>Vista3D no disponible. Los controles y simulaciones continúan funcionando.</p>
    <button type="button" (click)="reloadScene()">Recargar escena</button>
  </div>
}
